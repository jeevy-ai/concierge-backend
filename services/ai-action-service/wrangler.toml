name = "ai-action-service"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Unbound usage model — removes the 30s wall-clock cap so Vertex AI calls (26–55s) complete.
# Billed per GB-s of actual execution; at demo traffic volumes negligible cost difference.
# YOU-875: fix CF Worker 502s on /concierge/itinerary.
[limits]
cpu_ms = 30000

[vars]
ENVIRONMENT = "development"
POSTHOG_HOST = "https://eu.i.posthog.com"
# FROM_EMAIL should be a Resend-verified sender address, e.g. "team@jeevy.app"
FROM_EMAIL = "team@jeevy.app"
# CLERK_JWKS_URL is set per-environment via wrangler secret put or .dev.vars

# Secrets (set via `wrangler secret put <NAME>`):
#   CLERK_JWKS_URL        Clerk JWKS endpoint — https://<your-clerk-domain>/.well-known/jwks.json
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_SECRET_KEY
#   POSTHOG_API_KEY       (staging key for dev/staging, prod key for production env)
#   RESEND_API_KEY        (Resend API key for transactional email)
#   SCHEDULING_LINK       (UXDesigner Calendly/Cal.com 20-min link, M-F 9am-5pm)
#   INTERNAL_API_SECRET   (shared secret for /internal/* routes)
#   CONCIERGE_DEMO_SECRET (demo secret for /concierge/* — F3 YOU-866; also set in solo-travel-demo.html)
#   CLERK_SECRET_KEY      (Clerk secret key for user profile lookup in nightly cron)
#   ANTHROPIC_API_KEY     (Anthropic API key for POST /concierge/itinerary — desired end state, YOU-681)
#   VERTEX_SA_JSON        (GCP service-account JSON for Gemini on Vertex — interim provider, YOU-686)
#   GCP_PROJECT_ID        (GCP project ID with Vertex AI enabled — interim provider, YOU-686)
#   NEON_DATABASE_URL     (YOU-913) Neon connection string for per-account butler persistence.
#                         Provisioning: create project at console.neon.tech, then:
#                           psql $NEON_DATABASE_URL -f db/schema.sql
#                           wrangler secret put NEON_DATABASE_URL --env production
#   GCP_PROJECT_ID        (GCP project ID with Vertex AI enabled — interim provider, YOU-686)

# Cron trigger: nightly at-risk user scan for save-interview outreach.
[triggers]
crons = ["0 2 * * *"]

# KV namespace for entitlement state.
# Provisioned 2026-05-06 for YOU-296.
[[kv_namespaces]]
binding = "ENTITLEMENTS_KV"
id = "5634d6240d2142ed9d70e078999d8031"
preview_id = "5634d6240d2142ed9d70e078999d8031"

# KV namespace for save-interview state (last value events, NPS, dedup).
# Provisioned 2026-05-20 for YOU-343.
[[kv_namespaces]]
binding = "INTERVIEWS_KV"
id = "49051f56c5294cbb8751c7d4af6aa83f"
preview_id = "49051f56c5294cbb8751c7d4af6aa83f"

# KV namespace for concierge user memory: trip history + preference signals.
# Provisioned 2026-06-23 for YOU-893.
[[kv_namespaces]]
binding = "CONCIERGE_KV"
id = "912311d3f44046038ecb82164b90290f"
preview_id = "912311d3f44046038ecb82164b90290f"

# --- Named environments ---
# Deploy: `wrangler deploy --env staging` / `wrangler deploy --env production`
# Secrets: `wrangler secret put POSTHOG_API_KEY --env staging` (after first deploy)

[env.staging]
name = "ai-action-service-staging"

[env.staging.limits]
cpu_ms = 30000

[env.staging.vars]
ENVIRONMENT = "staging"
POSTHOG_HOST = "https://eu.i.posthog.com"
FROM_EMAIL = "team@jeevy.app"

[[env.staging.kv_namespaces]]
binding = "ENTITLEMENTS_KV"
id = "fed8625627b042f0a07069d7bb03a5f1"

[[env.staging.kv_namespaces]]
binding = "INTERVIEWS_KV"
id = "9e12aea1abcb4e668633abffee66b56c"

[[env.staging.kv_namespaces]]
binding = "CONCIERGE_KV"
id = "3869105e18f240029c504a3762814531"

[env.production]
name = "ai-action-service-production"

[env.production.limits]
cpu_ms = 30000

[env.production.vars]
ENVIRONMENT = "production"
POSTHOG_HOST = "https://eu.i.posthog.com"
FROM_EMAIL = "team@jeevy.app"

[[env.production.kv_namespaces]]
binding = "ENTITLEMENTS_KV"
id = "f8c6bfb4943e436d8591691d22b7037b"

[[env.production.kv_namespaces]]
binding = "INTERVIEWS_KV"
id = "68e68d7db26c4bda8c97bb222c3d9018"

[[env.production.kv_namespaces]]
binding = "CONCIERGE_KV"
id = "4c911a21b40c49408a1c81565ff774b0"
