name = "jeevy-board-ui"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put <NAME>`):
#   INTERNAL_API_SECRET  — shared secret forwarded to ai-action-service

# Service binding to ai-action-service-staging.
# Worker-to-Worker via service binding avoids CF error 1042 (same-account
# subrequest block) that occurs when fetching via public workers.dev URL.
[[services]]
binding = "AI_ACTION_SERVICE"
service = "ai-action-service-staging"
